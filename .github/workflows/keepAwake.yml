name: keep-awake

# The API runs on Render's free plan, which sleeps after 15 idle minutes and
# then takes about a minute to wake. Ping it so visitors never wait.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://risklayer-api.onrender.com/health
